name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Parte 2 – Validações
      - name: Verificar se a pasta src existe
        run: test -d src || (echo " ERRO: pasta src não encontrada!" && exit 1)

      - name: Verificar se o CSS está no caminho correto
        run: test -f src/css/style.css || (echo " ERRO: CSS não encontrado em src/css/style.css" && exit 1)

      - name: Linting Profissional - HTMLHint
        uses: Cyb3r-Jak3/htmlhint-action@v1.1.0
        with:
          target_pattern: 'src/index.html'

      - name: Explorando o Runner
        run: lsb_release -a && free -h

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'src'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Auditoria Final
        run: echo "O código do aluno DAVID foi auditado, está seguindo as normas corretas e está pronto para o deploy!"

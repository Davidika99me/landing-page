name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Verificar pasta src
      - name: Verificar se a pasta src existe
        run: |
          if [ ! -d src ]; then
            echo "ERRO: pasta src nao encontrada!"
            exit 1
          fi

      # 3. Verificar CSS no novo caminho
      - name: Verificar se o CSS está no caminho correto
        run: |
          if [ ! -f src/css/style.css ]; then
            echo "ERRO: arquivo src/css/style.css nao encontrado!"
            exit 1
          fi

      # 4. Linting Profissional – HTMLHint
      - name: Linting Profissional - HTMLHint
        uses: kabirbaidhya/htmlhint-github-action@v1.0.4
        with:
          htmlhint_args: "src/index.html"

      # (Opcional) Apenas explorando o runner
      - name: Explorando o Runner
        run: lsb_release -a && free -h

      # 5. Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 6. Upload da pasta src como artefato
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'src'

      # 7. Deploy para o GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 8. Auditoria Final
      - name: Auditoria Final
        run: echo "O código do aluno DAVID foi auditado, está seguindo as normas corretas e está pronto para o deploy!"

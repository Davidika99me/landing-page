name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparando Versão de Produção
        run: |
          echo " Iniciando pipeline de preparação..."

          echo " Verificando estrutura"
          test -d src || (echo " ERRO: pasta src não encontrada!" && exit 1)
          test -f src/index.html || (echo " ERRO: arquivo src/index.html não encontrado!" && exit 1)

          if [ ! -f src/css/style.css ]; then
            echo " ERRO: arquivo src/css/style.css não encontrado!"
            exit 1
          fi

          echo " Verificando footer com nome do aluno..."
          if ! grep -qi "<footer>.*david.*</footer>" src/index.html; then
            echo " ERRO: O HTML deve conter um <footer> com o nome do aluno!"
            exit 1
          fi

          echo "🔍 Instalando HTMLHint"
          npm install -g htmlhint

          echo "🔎 Rodando HTMLHint"
          htmlhint src/index.html

          echo " Gerando pasta dist/"
          mkdir -p dist
          cp src/index.html dist/
          cp -R src/css dist/ 2>/dev/null || echo " Aviso: pasta css não encontrada"

          echo "Conteúdo final da pasta dist/"
          ls -R dist

          echo "Pasta de produção gerada com sucesso!"

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Auditoria Final
        run: echo " Auditoria concluída o código do aluno DAVID está pronto para o deploy!"